[package]
name = "sage-ls"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
arc-swap = "1"
rayon.workspace = true
regex.workspace = true
sage-index = { path = "../sage-index" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-lsp-server.workspace = true
# One allocator on every platform: it returns freed pages to the OS after indexing bursts
# (the system allocators kept the parse high-water mark resident) and replaces musl's slow
# default allocator on Linux.
mimalloc = "0.1"
libmimalloc-sys = { version = "0.1", features = ["extended"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security"] }
