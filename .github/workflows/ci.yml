name: CI

on:
  push:
    branches:
      - main
      - develop
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  # The tag release in package.yml reuses this gate before publishing anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test builds need no debug info; it slows linking and bloats the Rust cache.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Fast per-push check of the platforms the macOS gate cannot cover. Full release packaging for
  # every target runs in package.yml on tags, pull requests, and manual dispatch.
  rust-tests:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, runner: ubuntu-24.04 }
          - { name: win32-x64, runner: windows-2025 }
          - { name: darwin-x64, runner: macos-15-intel }
    name: rust-tests (${{ matrix.name }})
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup toolchain install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: tests-${{ matrix.name }}
          cache-on-failure: true

      - name: Test native Rust behavior
        run: cargo test --locked

      - name: Check out latest Sage source for the editor regression
        if: matrix.name == 'linux-x64'
        uses: actions/checkout@v7
        with:
          repository: sagemath/sage
          path: sage
          fetch-depth: 1
          sparse-checkout: |
            src/sage
          persist-credentials: false

      - name: Set up Node.js
        if: matrix.name == 'linux-x64'
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Prepare Node and isolated VS Code
        if: matrix.name == 'linux-x64'
        run: |
          npm install --global npm@11
          npm ci
          node scripts/prepare-vscode-test.mjs

      - name: Linux editor regression
        if: matrix.name == 'linux-x64'
        run: xvfb-run -a npm run test:extension-host
        env:
          SAGE_TEST_NATIVE_SOURCE_ROOT: ${{ github.workspace }}/sage/src

  node-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: "22.x"
            npm-version: "11"
          - node-version: "26.x"
            npm-version: "12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Select npm ${{ matrix.npm-version }}
        run: npm install --global npm@${{ matrix.npm-version }}

      - name: Install Node dependencies
        run: npm ci

      - name: Check Node/npm compatibility
        run: |
          npm run check:package-toolchain
          npm run lint
          npm run build --workspace @sage-vscode/syntax-pack
          npm run build --workspace sage-vscode-extension
          npm run test --workspace @sage-vscode/syntax-pack
          npm run test --workspace sage-vscode-extension

  macos-package-compatibility:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Select npm 12
        run: npm install --global npm@12

      - name: Set up Rust
        run: rustup toolchain install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Node dependencies
        run: npm ci

      - name: Package VSIX with Node 26 and npm 12
        run: npm run package:vsix

  macos-checks:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CI: "1"
      SAGE_PERF_PARSE_MS: "3000"
      SAGE_PERF_REBUILD_INTERNAL_MS: "3000"
      SAGE_PERF_REBUILD_ELAPSED_MS: "8000"
      SAGE_PERF_SKIP_WORKBENCH: "1"
      SAGE_SOURCE_ROOT: ${{ github.workspace }}/sage/src
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out latest Sage source
        uses: actions/checkout@v7
        with:
          repository: sagemath/sage
          path: sage
          fetch-depth: 1
          sparse-checkout: |
            src/sage
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Select supported npm
        run: npm install --global npm@11

      - name: Set up Rust
        run: rustup toolchain install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Node dependencies
        run: npm ci

      - name: Fetch Rust dependencies
        run: cargo fetch --locked

      - name: Run macOS CI gate
        run: npm run test:ci
