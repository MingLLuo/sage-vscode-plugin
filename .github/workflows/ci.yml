name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  bootstrap-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm install

      - name: Install Python dependencies
        run: python -m pip install -e ./packages/sage-lsp[dev]

      - name: Sync syntax assets
        run: npm run sync:syntax

      - name: Run bootstrap checks
        run: |
          npm run build
          npm run test

