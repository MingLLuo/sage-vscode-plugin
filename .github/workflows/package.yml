name: Platform packages

# Ordinary pushes run the faster ci.yml checks; full release packaging runs for tags, pull requests
# that touch shipped code, and manual runs (optionally limited to some targets).
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated targets to package (e.g. linux-x64,win32-x64), or all"
        default: all
        required: false
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'scripts/**'
      - 'crates/**'
      - 'packages/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.github/workflows/package.yml'

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        shell: bash
        env:
          TARGETS: ${{ inputs.targets || 'all' }}
        run: |
          all='[
            {"target":"darwin-arm64","runner":"macos-15","rust":"aarch64-apple-darwin"},
            {"target":"darwin-x64","runner":"macos-15-intel","rust":"x86_64-apple-darwin"},
            {"target":"linux-x64","runner":"ubuntu-24.04","rust":"x86_64-unknown-linux-musl"},
            {"target":"linux-arm64","runner":"ubuntu-24.04-arm","rust":"aarch64-unknown-linux-musl"},
            {"target":"win32-x64","runner":"windows-2025","rust":"x86_64-pc-windows-msvc"},
            {"target":"win32-arm64","runner":"windows-11-arm","rust":"aarch64-pc-windows-msvc"}
          ]'
          if [[ "$TARGETS" == all ]]; then
            selected=$(jq -c . <<<"$all")
          else
            selected=$(jq -c --arg wanted "$TARGETS" \
              '($wanted | split(",") | map(gsub("^\\s+|\\s+$"; ""))) as $w | map(select(.target as $t | $w | index($t)))' <<<"$all")
          fi
          if [[ "$selected" == "[]" ]]; then
            echo "::error::no known target in '$TARGETS'"
            exit 1
          fi
          echo "matrix={\"include\":$selected}" >> "$GITHUB_OUTPUT"

  package:
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SAGE_VSIX_TARGET: ${{ matrix.target }}
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install rustup where the image lacks it
        if: matrix.target == 'win32-arm64'
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf -o rustup-init.exe https://win.rustup.rs/aarch64
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install pinned Rust toolchain and target
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # Save after failures too, so a red run does not force the next one to compile from scratch.
          cache-on-failure: true
      - name: Install native musl compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Select supported npm
        run: npm install --global npm@11
      - name: Install Node dependencies
        run: npm ci
      - name: Verify target selection and notices
        run: npm run test:package-targets
      - name: Test native Rust behavior
        run: cargo test --locked
      - name: Build target VSIX
        run: npm run package:vsix
      - name: Check packaged executable handshake
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; else suffix=; fi
          packages/extension-core/resources/bin/${{ matrix.target }}/sage-ls$suffix --version
      - name: Package Alpine alias from the same musl binary
        if: runner.os == 'Linux'
        shell: bash
        run: node scripts/package-vsix.mjs --target "${SAGE_VSIX_TARGET/linux-/alpine-}"
      - name: Verify package contents
        run: npm run test:vsix-package
      - name: Verify Alpine package contents
        if: runner.os == 'Linux'
        shell: bash
        run: SAGE_VSIX_TARGET="${SAGE_VSIX_TARGET/linux-/alpine-}" npm run test:vsix-package
      - name: Prepare isolated VS Code
        run: node scripts/prepare-vscode-test.mjs
      - name: Install target package into isolated profile
        run: npm run test:vsix-install
      - name: Check out latest Sage source for the editor regression
        if: matrix.target == 'linux-x64'
        uses: actions/checkout@v7
        with:
          repository: sagemath/sage
          path: sage
          fetch-depth: 1
          sparse-checkout: |
            src/sage
          persist-credentials: false
      - name: Linux editor regression
        if: matrix.target == 'linux-x64'
        run: xvfb-run -a npm run test:extension-host
        env:
          SAGE_TEST_NATIVE_SOURCE_ROOT: ${{ github.workspace }}/sage/src
      - uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.target }}
          path: dist/*.vsix
          if-no-files-found: error

  gate:
    # Releases ship only what passes the full CI gate on the tagged commit.
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Require the tag to match the extension version
        shell: bash
        run: |
          version=$(node -p "require('./packages/extension-core/package.json').version")
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match extension version ${version}"
            exit 1
          fi
      - uses: actions/download-artifact@v7
        with:
          pattern: vsix-*
          path: dist
          merge-multiple: true
      - name: Attach internally distributed VSIX files to the tag release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(dist/*.vsix)
          if (( ${#files[@]} != 8 )); then
            echo "::error::expected 8 VSIX files (6 native targets + 2 Alpine aliases), found ${#files[@]}"
            ls -la dist
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG"; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          fi
          # No --clobber: re-running a release must not silently replace published files.
          gh release upload "$RELEASE_TAG" "${files[@]}"
