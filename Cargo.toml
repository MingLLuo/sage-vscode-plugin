[workspace]
members = [
  "crates/sage-index",
  "crates/sage-ls",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.2.0"

[workspace.dependencies]
anyhow = "1.0"
ignore = "0.4"
notify = "8.0"
rayon = "1.10"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "io-std", "sync", "time"] }
tower-lsp = "0.20"
tree-sitter = "0.20"
tree-sitter-python = "0.20"
