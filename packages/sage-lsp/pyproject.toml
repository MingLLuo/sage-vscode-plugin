[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-lsp"
version = "0.1.0"
description = "pygls-based language server scaffold for Sage VS Code Plugin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pygls>=1.3.1",
  "lsprotocol>=2023.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4"
]

[project.scripts]
sage-lsp = "sage_lsp.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

